name: Commit Biloo ERP migration

on:
  push:
    branches: [agent/biloo-erp-rebrand]

permissions:
  contents: write

jobs:
  commit-migration:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ERP rebrand branch
        uses: actions/checkout@v4
        with:
          ref: agent/biloo-erp-rebrand

      - name: Extract and apply the prepared migration
        shell: bash
        run: |
          awk '/python - <<'"'"'PY'"'"'/{capture=1;next} /^          PY$/{capture=0} capture{sub(/^          /, ""); print}' .github/workflows/apply-biloo-erp-brand.yml > /tmp/biloo_erp_migration.py
          python /tmp/biloo_erp_migration.py

      - name: Remove temporary migration machinery
        run: rm -f .github/workflows/apply-biloo-erp-brand.yml .biloo-migration-trigger

      - name: Commit the Biloo ERP rebrand
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebrand ERP platform as Biloo ERP"
          git push origin HEAD:agent/biloo-erp-rebrand
